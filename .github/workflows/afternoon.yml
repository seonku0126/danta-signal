name: afternoon
# cron-job.org 가 14:30 KST 에 깨운다. schedule 은 예비.
on:
  workflow_dispatch:
  schedule:
    - cron: "33 5 * * 1-5"    # UTC 05:33 = KST 14:33 (월~금)
concurrency:
  group: danta-afternoon
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CHANNEL_NAME: 단타 시그널
    steps:
      - uses: actions/checkout@v4
      - name: wait for morning job state
        run: |
          for i in $(seq 1 20); do
            git pull -q
            python3 -c "import json,datetime,sys; s=json.load(open('data/state.json')) if __import__('os').path.exists('data/state.json') else {}; t=datetime.datetime.now().strftime('%Y%m%d'); sys.exit(0 if s.get('day')!=t or s.get('done') or s.get('pos') else 1)" && break
            sleep 30
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m danta.gh afternoon
      - name: archive minutes (private repo)
        if: always()
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: ${{ github.repository_owner }}/danta-data
        run: |
          # 네이버 분봉은 공개 저장소에 올리지 않고 비공개 저장소 danta-data 로 보낸다.
          ls data/minutes/*.json.gz >/dev/null 2>&1 || exit 0
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "::warning::DATA_REPO_TOKEN 없음 - 분봉을 아티팩트로만 임시 보관"
            echo "NO_DATA_REPO=1" >> "$GITHUB_ENV"; exit 0
          fi
          git clone -q --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" /tmp/danta-data
          mkdir -p /tmp/danta-data/minutes
          cp -n data/minutes/*.json.gz /tmp/danta-data/minutes/
          cd /tmp/danta-data
          git config user.name "danta-bot"; git config user.email "danta-bot@users.noreply.github.com"
          git add minutes
          git diff --cached --quiet || git commit -qm "minutes $(date +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
          cd - >/dev/null
          git rm -r -q --cached --ignore-unmatch data/minutes
          rm -rf data/minutes
      - name: keep minutes as artifact (fallback)
        if: always() && env.NO_DATA_REPO == '1'
        uses: actions/upload-artifact@v4
        with:
          name: minutes-${{ github.run_id }}
          path: data/minutes/
          retention-days: 14
      - name: save state
        if: always()
        run: |
          git config user.name "danta-bot"
          git config user.email "danta-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "afternoon $(date +%F)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 5; done
