name: morning
# 정시 실행은 cron-job.org 가 workflow_dispatch 로 깨운다 (08:40 KST).
# 아래 schedule 은 cron-job.org 가 실패했을 때를 위한 예비. 중복 실행은 코드가 막는다.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 23 * * 0-4"   # UTC 23:41 = KST 08:41 (월~금)
concurrency:
  group: danta-morning
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CHANNEL_NAME: 단타 시그널
      PREMARKET_TIME: "08:45"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m danta.gh morning
      - name: save state
        if: always()
        run: |
          git config user.name "danta-bot"
          git config user.email "danta-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "morning $(date +%F)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 5; done
